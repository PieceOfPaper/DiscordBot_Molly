name: 건의 및 개선사항
description: 새로운 기능이나 개선 아이디어를 자유롭게 알려주세요.
title: "[건의] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        생각난 내용을 편하게 적어주세요. 해결 방법이나 자세한 예시가 없어도 괜찮습니다.
        개인정보나 비공개 채널 내용은 올리지 마세요.

  - type: textarea
    id: proposal
    attributes:
      label: 어떤 기능이나 개선을 원하나요?
      description: 추가되거나 바뀌었으면 하는 내용을 자유롭게 적어주세요.
      placeholder: 배틀이 끝났을 때 양쪽 캐릭터의 남은 체력도 보여주면 좋겠어요.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 추가로 알려줄 내용
      description: 필요한 이유, 원하는 모습, 예시나 참고할 기능이 있다면 선택해서 적어주세요.
      placeholder: 모르는 항목은 비워두셔도 됩니다.
