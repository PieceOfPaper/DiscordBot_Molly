name: 건의 및 개선사항
description: 새로운 기능이나 기존 기능의 개선 아이디어를 알려주세요.
title: "[건의] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        건의해 주셔서 감사합니다. 해결 방법이 완성되어 있지 않아도 괜찮습니다.
        현재 불편한 점과 원하는 결과를 중심으로 적어주세요.

  - type: textarea
    id: proposal
    attributes:
      label: 건의 내용
      description: 추가하거나 개선했으면 하는 내용을 적어주세요.
      placeholder: 배틀 종료 메시지에 양쪽 캐릭터의 남은 체력을 표시하면 좋겠습니다.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
      description: 현재 어떤 점이 불편하거나 아쉬운지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 원하는 동작
      description: 실제로 적용된다면 어떤 모습이면 좋을지 예시와 함께 적어주세요.
      placeholder: |
        종잇장 승리!
        종잇장 HP 12% / ZEL HP 0%
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 다른 방법
      description: 생각해 본 다른 방법이나 참고할 사례가 있다면 적어주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 기존 Issue에 같은 건의가 있는지 확인했습니다.
          required: true
        - label: 개인정보나 비공개 내용을 포함하지 않았습니다.
          required: true
