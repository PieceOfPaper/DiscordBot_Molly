name: 버그 제보
description: 몰리봇에서 정상적으로 동작하지 않는 기능을 알려주세요.
title: "[버그] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 재현에 필요한 내용만 적어주세요.
        Discord 토큰, Google 인증 정보, 서버 IP, 개인 메시지와 같은 비공개 정보는 올리지 마세요.

  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 어떤 기능에서 무슨 문제가 발생했는지 적어주세요.
      placeholder: /배틀 진행 중 집중 효과가 끝났는데도 비검 준비 확률이 계속 높게 적용됩니다.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      description: 문제가 다시 발생하도록 실행한 순서를 적어주세요. 모르는 경우에는 당시 상황을 적어주세요.
      placeholder: |
        1. /배틀 명령어로 검술사 배틀을 시작했습니다.
        2. 일섬으로 집중을 획득했습니다.
        3. 집중 효과가 끝날 때까지 진행했습니다.
        4. 강철 쐐기를 사용했습니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 원래 어떻게 동작해야 한다고 생각했는지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 로그 또는 화면
      description: 관련 로그나 화면이 있다면 비밀 정보와 개인정보를 지운 뒤 첨부해 주세요.
      placeholder: 로그, 스크린샷 또는 오류 메시지

  - type: input
    id: command
    attributes:
      label: 관련 명령어
      description: 문제가 발생한 명령어가 있다면 적어주세요.
      placeholder: /배틀

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 기존 Issue에 같은 문제가 있는지 확인했습니다.
          required: true
        - label: 토큰, 인증 정보, 개인정보를 포함하지 않았습니다.
          required: true
