name: 버그 제보
description: 몰리봇에서 이상하거나 불편했던 동작을 자유롭게 알려주세요.
title: "[버그] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        아는 내용만 편하게 적어주세요. 개발 용어나 정확한 재현 방법을 몰라도 괜찮습니다.
        Discord 토큰, 인증 정보, 서버 정보, 개인 메시지와 같은 비공개 정보는 올리지 마세요.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제가 있었나요?
      description: 언제, 어떤 기능에서, 무슨 일이 있었는지 자유롭게 적어주세요.
      placeholder: /배틀을 했는데 집중 효과가 끝난 뒤에도 비검이 너무 자주 나오는 것 같아요.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 추가로 알려줄 내용
      description: 재현 방법, 기대했던 동작, 오류 메시지, 화면이나 로그가 있다면 선택해서 적어주세요.
      placeholder: 모르는 항목은 비워두셔도 됩니다.
